name: Build Android APK & Apple iOS IPA (Las Brazas)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build iOS (.ipa) on macOS Xcode
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "BASE_URL=https://lasbrazas.ramio.tech" > .env
          echo "APP_NAME=Las Brazas" >> .env

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into LasBrazas-iOS.ipa
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r LasBrazas-iOS.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LasBrazas-iOS-IPA
          path: build/ios/ipa/LasBrazas-iOS.ipa

  build-android-apk:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "BASE_URL=https://lasbrazas.ramio.tech" > .env
          echo "APP_NAME=Las Brazas" >> .env

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LasBrazas-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

